<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Personal Budjet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: mode switch on top · scrolling form (wallets, amount, category, date, recent) · keypad docked at the bottom.
   The accent colour follows the entry type: rust = chiqim, green = kirim, blue = almashtirish. */
:root {
  --bg: #EEF1EF;
  --surface: #FFFFFF;
  --sunken: #E3E8E5;
  --ink: #15201C;
  --muted: #5B6863;
  --line: #D6DDD9;
  --out: #B3431D;
  --in: #1C774A;
  --ex: #2B57B0;
  --accent: var(--out);
  --on-accent: #FFFFFF;
  /* Rejim rangi ekran tepasida yengil fon boʻlib turadi */
  --wash-out: #F6E7DE; --wash-in: #E0EFE6; --wash-ex: #E2E8F6;
  --wash: var(--wash-out);
  /* Har bir hamyonning oʻz rangi (hamma joyda bir xil) */
  --w-cash-sum: #1D7A66; --w-card-sum: #3A62B5; --w-cash-usd: #5F7D1D; --w-visa: #2E3F92; --w-master: #BF561C;
  --danger: #B42318;
  --on-danger: #FFFFFF;
  --toast: #15201C;
  --on-toast: #EEF1EF;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1210; --surface: #161D1A; --sunken: #1F2724; --ink: #E6ECE9; --muted: #92A09A; --line: #28322E;
    --out: #EE7A4E; --in: #4CC189; --ex: #82A4F3; --on-accent: #0D1210;
    --danger: #F97066; --on-danger: #0D1210; --toast: #E6ECE9; --on-toast: #0D1210;
    --wash-out: #2B1C15; --wash-in: #12271C; --wash-ex: #172037;
    --w-cash-sum: #4CC0A4; --w-card-sum: #86A6F2; --w-cash-usd: #AAC867; --w-visa: #96A3F2; --w-master: #F08C58;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1210; --surface: #161D1A; --sunken: #1F2724; --ink: #E6ECE9; --muted: #92A09A; --line: #28322E;
  --out: #EE7A4E; --in: #4CC189; --ex: #82A4F3; --on-accent: #0D1210;
  --danger: #F97066; --on-danger: #0D1210; --toast: #E6ECE9; --on-toast: #0D1210;
  --wash-out: #2B1C15; --wash-in: #12271C; --wash-ex: #172037;
  --w-cash-sum: #4CC0A4; --w-card-sum: #86A6F2; --w-cash-usd: #AAC867; --w-visa: #96A3F2; --w-master: #F08C58;
  color-scheme: dark;
}
/* Ilova doim yorugʻ fonda: Telegram yoki telefon tungi rejimda boʻlsa ham */
:root[data-theme="light"] { color-scheme: light; }
body[data-mode="out"] { --wash: var(--wash-out); }
body[data-mode="in"] { --accent: var(--in); --wash: var(--wash-in); }
body[data-mode="ex"] { --accent: var(--ex); --wash: var(--wash-ex); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }

.app { height: 100%; display: flex; flex-direction: column; position: relative;
  background: var(--bg); background: linear-gradient(180deg, var(--wash) 0, var(--wash) 56px, var(--bg) 340px); transition: background .25s; }

/* top */
.top { flex: none; padding-block: 10px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 12px;
  background: var(--sunken); background: color-mix(in srgb, var(--accent) 10%, var(--sunken)); }
.seg button { height: 36px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.demo { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.demo b { color: var(--ink); font-weight: 600; }

/* scroll area */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 6px 18px; padding-left: var(--gut-l); padding-right: var(--gut-r);
}
.form { display: flex; flex-direction: column; gap: 16px; }
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.link { font-size: 13px; font-weight: 600; color: var(--accent); }

/* wallets */
.hscroll {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-left: calc(-1 * var(--gut-l)); margin-right: calc(-1 * var(--gut-r));
  padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 1px;
}
.hscroll::-webkit-scrollbar { display: none; }
.wallet {
  --wc: var(--muted);
  flex: none; min-width: 108px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 8px 12px; border-radius: 12px; text-align: left; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--wc) 5%, var(--surface));
}
.wallet .w-name { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.wallet .w-name::before, .wdot { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--wc); margin-right: 6px; vertical-align: 1px; }
.wallet .w-bal { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wallet .w-bal.neg { color: var(--danger); }
.wallet[aria-pressed="true"] { border-color: var(--wc); box-shadow: inset 0 0 0 1px var(--wc);
  background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
.wallet[aria-pressed="true"] .w-name { color: var(--wc); }
.wallet:disabled { opacity: .38; cursor: default; }
.ex-rows { display: flex; flex-direction: column; gap: 6px; }
.ex-row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.swap { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); }
.swap svg { width: 16px; height: 16px; }

/* amount */
.amount { padding: 12px 16px 12px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--accent) 5%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 22%, var(--line)); }
.amount .amt-cur, .f-val .amt-cur { color: var(--accent); }
.amt { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 6px; min-height: 48px;
  font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.amt.long { font-size: 28px; min-height: 48px; }
.amt.empty .amt-val { color: var(--muted); opacity: .55; }
.amt-cur { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.caret { display: inline-block; width: 2px; height: .9em; background: var(--accent); align-self: center; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .seg button, .app { transition: none; } }
.amt-hint { display: flex; flex-wrap: wrap; column-gap: 10px; font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.amt-hint b { font-weight: 600; color: var(--ink); }

.ex-fields { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 8px; }
.ex-fields.single { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding: 10px 12px; text-align: left;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.field[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.f-lbl { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.f-val { display: flex; align-items: baseline; gap: 4px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.f-val.empty { color: var(--muted); opacity: .55; }
.f-val .amt-cur { font-size: 14px; }
.ex-out { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; padding: 10px 12px;
  border-radius: 12px; font-size: 13px; color: var(--muted);
  background: var(--sunken); background: color-mix(in srgb, var(--accent) 11%, var(--surface)); }
.ex-out b { font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fee-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; }
.fee-row .chips { gap: 6px; }
.nowrap { white-space: nowrap; }
.fee-note { margin-top: 6px; font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.fee-note.bad { color: var(--danger); }
.ex-got { width: 100%; margin-top: 8px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; max-width: 100%;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.sm { height: 34px; padding: 0 12px; font-size: 13.5px; }
.chip svg { width: 15px; height: 15px; flex: none; }
.chip input[type="date"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.meta { display: flex; flex-direction: column; gap: 10px; }
.note { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.note::placeholder { color: var(--muted); }

/* recent */
.recent { list-style: none; margin: 0; padding: 0; }
.rec { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; }
.rec[data-kind="out"] { --k: var(--out); }
.rec[data-kind="in"] { --k: var(--in); }
.rec[data-kind="ex"] { --k: var(--ex); }
.dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--k);
  background: var(--sunken); background: color-mix(in srgb, var(--k) 14%, transparent); }
.dot svg { width: 15px; height: 15px; }
.rec-main { min-width: 0; }
.rec-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.rec[data-kind="in"] .rec-amt { color: var(--in); }
.rec .undo { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--accent); }
.rec.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 12%, transparent); } to { background: transparent; } }
.empty-note { margin: 0; color: var(--muted); font-size: 13px; }
.rec-tip { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.old-backend { padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--line); background: var(--surface); }
.old-backend b { color: var(--ink); font-weight: 600; }

.state { padding: 48px 8px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.state strong { color: var(--ink); font-size: 16px; }
.state button { height: 40px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* dock */
.dock { flex: none; position: relative; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gut-l); padding-right: var(--gut-r); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.dock.empty { padding: 0; border-top: 0; }
.keypad.show { animation: kb-in .18s ease-out; }
@keyframes kb-in { from { transform: translateY(16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .keypad.show { animation: none; } }
.amount { cursor: pointer; }
.amount:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* summa oynasi ixcham: maslahat yozuvisiz */
.amount { padding: 9px 14px 10px; }
.amount .lbl-row { margin-bottom: 0; }
.amt { font-size: 34px; min-height: 40px; }
.amt.long { font-size: 26px; min-height: 40px; }
.amt-hint { min-height: 0; }
.amt-hint .usual { color: var(--accent); font-weight: 600; }
.keypad button { height: 48px; border-radius: 12px; background: var(--sunken); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;
  display: grid; place-items: center; transition: transform .06s; }
.keypad button:active { transform: scale(.96); background: var(--line); }
.keypad .op { font-size: 17px; color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--sunken)); }
.keypad .wide { grid-column: span 2; }
.keypad button:disabled { opacity: .3; }
.keypad svg { width: 24px; height: 24px; }
.save { margin-top: 8px; width: 100%; height: 50px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; }
.save:disabled { background: var(--sunken); color: var(--muted); cursor: default; }
@media (max-height: 640px) {
  .keypad button { height: 42px; }
  .amt { font-size: 34px; min-height: 40px; }
  .form { gap: 12px; }
}

.toast {
  position: absolute; left: var(--gut-l); right: var(--gut-r); bottom: calc(100% + 10px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-radius: 12px; background: var(--toast); color: var(--on-toast); font-size: 14px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .18);
}
.toast.error { background: var(--danger); color: var(--on-danger); }
.toast span { min-width: 0; }
.toast button { flex: none; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; color: inherit; }

/* hamyonlar: ixcham, oʻngda yana borligini bildiruvchi soya; jami qoldiq */
.wallet { min-width: 0; padding: 7px 11px; }
.wallet .w-name { font-size: 11.5px; }
.wallet .w-bal { font-size: 13.5px; }
.hscroll.more { -webkit-mask-image: linear-gradient(to right, #000 84%, transparent); mask-image: linear-gradient(to right, #000 84%, transparent); }
.total { font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.total b { color: var(--ink); }
/* byudjet (70/15/15) */
.budgets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bud { padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.bud.hot { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.bud-name { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bud-left { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bud-left.neg { color: var(--danger); }
.bud-bar { height: 4px; margin-top: 5px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.bud-bar i { display: block; height: 100%; border-radius: 4px; background: var(--in); }
.bud-bar i.warn { background: #C9861A; } .bud-bar i.over { background: var(--danger); }
/* tez summalar va oylik toʻlovlar */
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick .chip { height: 30px; font-size: 13px; padding: 0 10px; background: var(--bg); }
.recur .chip { flex: none; }
.wgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.wgrid .wallet { flex: 1 1 auto; }
.lbl-side { display: inline-flex; align-items: center; gap: 12px; }
.link.sm { font-size: 12.5px; }
.total.late { color: var(--danger); white-space: nowrap; }
.rc { --wc: var(--muted); flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.more-btn { display: block; margin: 8px auto 0; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--accent); }
.recur-body { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-bottom: 4px; }
.recur-body > * { flex: none; }
.recur-body .lbl { margin-top: 4px; }
.recur-body select.r-input { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.r-input { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; color: var(--ink); }
.r-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.r-field { display: flex; flex-direction: column; gap: 4px; }
.r-save { margin-top: 6px; }
.r-list { list-style: none; margin: 0; padding: 0; }
.r-list li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.r-list li:first-child { border-top: 0; }
.r-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 0; text-align: left; }
.r-list .x { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.r-list .x svg { width: 16px; height: 16px; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rgrid .rc { min-width: 0; }
.rgrid .rc-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.rgrid .rc-sub { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.rc-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.rc-name .wdot { margin-right: 6px; }
.rc-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rc.soon { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.rc .rc-date { color: var(--ink); }
.rc.soon .rc-date { color: var(--accent); font-weight: 600; }
.rc.late { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
.rc.late .rc-date { color: var(--danger); font-weight: 600; }
.recur .chip .am, .quick .chip .am { color: var(--muted); font-weight: 500; }
.quick .chip .am { font-size: 13px; display: inline-flex; align-items: center; gap: 5px; margin-left: 2px; }

/* tahrirlash paneli */
.editbar { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-radius: 14px;
  background: var(--surface); background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  border: 1px solid var(--line); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.eb-main { flex: 1; min-width: 0; }
.eb-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eb-del { flex: none; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--surface); color: var(--danger); font-weight: 600; font-size: 13px; }
.eb-del.confirm { background: var(--danger); color: var(--on-danger); }

.cmd-out { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .orb::before { transition: none; } }
.voice-body strong { font-size: 16px; }
.transcript { width: 100%; margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--sunken); text-align: left; font-size: 14px; }

.v-list { width: 100%; list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; text-align: left; }

.miss { color: var(--danger); font-weight: 600; }
.v-tip { margin: 0; width: 100%; font-size: 12.5px; color: var(--muted); text-align: left; }

.rec-mic { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.rec-mic svg { width: 20px; height: 20px; }
.linkish { font-size: 14px; font-weight: 600; color: var(--accent); padding: 6px 4px; }

/* category sheet */

    </div>
  </main>

  <footer class="dock" id="dock">
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="keypad" id="keypad" hidden>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="back" class="op" aria-label="Oxirgi raqamni oʻchirish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg></button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>

      <button class="q-clear" data-act="q-clear" aria-label="Tozalash" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

      <button class="icon-btn" data-act="recur-close" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="recur-body" id="recurBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===== SOZLAMA =====
     Apps Script Web App manzili (…/exec bilan tugaydi). Boʻsh qolsa, ilova namuna rejimida ishlaydi. */
  var API_URL = 'https://script.google.com/macros/s/AKfycbyDNMFKNOJB5HvsJBB8B-7mjAga8PXLiVil3_vW9uw8761tszuTDC7wjMUZfJnJONRV/exec';

  var USD_WALLETS = ['Cash dollar', 'Visa', 'Master card'];
  var EXCHANGE = 'Exchange';

  document.documentElement.setAttribute('data-theme', 'light');   // doim yorugʻ fon
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var IN_TG = !!(tg && tg.initData);
  var LIVE = !!(API_URL && IN_TG);

  var $ = function (s) { return document.querySelector(s); };
  var el = {
    form: $('#form'), state: $('#state'), wallet: $('#walletBlock'), amount: $('#amountBlock'), cat: $('#catBlock'),
    dates: $('#dates'), note: $('#note'), recent: $('#recentBlock'), keypad: $('#keypad'), save: $('#saveBtn'),
    toast: $('#toast'), sheet: $('#catSheet'), sheetBg: $('#sheetBg'), catList: $('#catList'),
    catQuery: $('#catQuery'), catPh: $('#catPh'), abc: $('#abc'),
    demo: $('#demoNote'), scroll: $('#scroll'),
    voiceSheet: $('#voiceSheet'), voiceBody: $('#voiceBody'), mic: $('#micBtn'), pending: $('#pendingBtn'),
    sync: $('#syncNote'), dock: $('#dock'), budget: $('#budgetBlock'), recur: $('#recurBlock'),
    editBar: $('#editBar'), receiptFile: $('#receiptFile'), recurSheet: $('#recurSheet'), recurBody: $('#recurBody')
  };
  // Oylik toʻlov qoʻshish oynasi
  var R = { open: false, cat: null, amount: '', wallet: null, day: '', busy: false };
  var VOICE_MAX_SEC = 60;
  // Ovoz holati: idle | input | rec | busy | review | error
  var V = { open: false, state: 'idle', entries: [], transcript: '', error: '', text: '', source: 'voice', stream: null, rec: null, chunks: [],
            ac: null, analyser: null, raf: 0, timer: 0, t0: 0, cancelled: false };

  var S = {
    mode: 'out', amount: '', rate: '', focus: 'amount',
    wallet: { out: null, in: null }, touched: { out: false, in: false },
    cat: { out: null, in: null }, from: null, to: null,
    date: null, busy: false, ready: false, lastSaved: null, sheetOpen: false,
    kb: false,      // raqam klaviaturasi ochiqmi (summa bosilganda ochiladi)

    stale: false    // telefondagi oxirgi nusxa koʻrsatilyapti, sheetdan yangisi kelyapti
  };
  var D = null;
  var toastTimer = null;
  var demoRow = 5000;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function isUsd(w) { return USD_WALLETS.indexOf(w) >= 0; }
  function group(i) { return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function fmtNum(n, maxDec) {
    if (!isFinite(n)) return '—';
    var neg = n < 0; n = Math.abs(n);
    var p = Math.pow(10, maxDec);
    var s = (Math.round(n * p) / p).toFixed(maxDec);
    if (maxDec > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    var parts = s.split('.');
    return (neg ? '−' : '') + group(parts[0]) + (parts[1] ? ',' + parts[1] : '');
  }
  function money(n, w) { return isUsd(w) ? '$' + fmtNum(n, 2) : fmtNum(n, 0) + ' soʻm'; }
  function total(expr) { return String(expr || '').split('+').reduce(function (s, t) { return s + (parseFloat(t) || 0); }, 0); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function showExpr(expr) {
    if (!expr) return '0';
    return expr.split('+').map(function (t) {
      if (t === '') return '';
      var p = t.split('.');
      return group(p[0] || '0') + (p.length > 1 ? ',' + p[1] : '');
    }).join(' + ');
  }
  function iso(d) { var z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function shiftIso(s, days) { var p = s.split('-').map(Number); return iso(new Date(p[0], p[1] - 1, p[2] + days)); }
  function ddmm(s) { var p = String(s).split('-'); if (p.length < 3) return s; return p[2] + '.' + p[1] + (Number(p[0]) !== new Date().getFullYear() ? '.' + p[0] : ''); }
  function convert(amount, from, to, rate) {
    var fu = isUsd(from), tu = isUsd(to);
    if (fu === tu) return amount;
    if (!(rate > 0)) return NaN;
    return fu ? amount * rate : amount / rate;
  }
  function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
  function haptic(kind) {
    if (!tg || !tg.HapticFeedback) return;
    try {
      if (kind === 'select') tg.HapticFeedback.selectionChanged();
      else if (kind === 'light') tg.HapticFeedback.impactOccurred('light');
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}
  }
  // Dollar → Card sum: soʻm kartaga tushayotganda oʻtkazma komissiyasi ushlanadi.
  // Bank kabi hisoblanadi: yuboruvchi summa + komissiya = $ × kurs, ya'ni kartaga $ × kurs ÷ (1 + foiz) tushadi
  // (chek bilan tekshirilgan: 1 195 000 ÷ 1,0075 = 1 186 104,22). Sheetga bitta Exchange qatori yoziladi,
  // kursi komissiya ayrilgan holda; asl kurs va foiz izohga yoziladi.
  var FEE_TO = 'Card sum', FEE_FROM = 'Cash dollar', FEE_DEFAULT = '1.1', FEE_PRESETS = ['1.1', '1', '0.75'], FEE_KEY = 'pb-fee-v1';
  function feeApplies(from, to) { return from === FEE_FROM && to === FEE_TO; }
  // Oxirgi ishlatilgan foiz keyingi safar ham tanlangan turadi
  function lastFee() { try { var v = localStorage.getItem(FEE_KEY); if (FEE_PRESETS.indexOf(v) >= 0) return v; } catch (e) {} return FEE_DEFAULT; }
  function rememberFee(p) { p = String(p); if (FEE_PRESETS.indexOf(p) >= 0) { try { localStorage.setItem(FEE_KEY, p); } catch (e) {} } }
  function defaultFee(from, to) { return feeApplies(from, to) ? lastFee() : '0'; }
  // Sheetga yoziladigan kurs: butun son (12 000 ÷ 1,011 = 11 869), verguldan keyingi raqamlarsiz
  function effRate(rate, pct) { return Math.round(rate / (1 + (parseFloat(pct) || 0) / 100)); }
  // Hamyonga tushadigan summa: komissiyali boʻlsa $ × butun kurs (sheet ham aynan shunday hisoblaydi)
  // "Aniq summa" (pct === 'got'): chekdagi kartaga tushgan summa kiritiladi, kurs = summa ÷ $ (butun son)
  function netRate(amt, rate, pct, got) {
    if (pct === 'got') return got > 0 && amt > 0 ? Math.round(got / amt) : NaN;
    return effRate(rate, pct);
  }
  function exchangeNet(amt, from, to, rate, pct, got) {
    return feeApplies(from, to) && rate > 0 && !S.edit ? amt * netRate(amt, rate, pct, got) : convert(amt, from, to, rate);
  }
  // Tushgan summa beriladigan summaga nisbatan aqlga sigʻadimi (xato bosilgan nol va h.k.)
  function gotProblem(amt, rate) {
    var g = total(S.got), gross = amt * rate;
    if (!(g > 0)) return 'Kartaga tushgan summani kiriting';
    if (gross > 0 && (g > gross * 1.1 || g < gross * 0.8)) return 'Tushgan summani tekshiring';
    return '';
  }
  function resetFee() { S.fee = defaultFee(S.from, S.to); S.got = ''; if (S.focus === 'fee' || S.focus === 'got') S.focus = 'amount'; }
  function pctLabel(p) { return fmtNum(parseFloat(p) || 0, 2) + '%'; }
  function rateFor(f, t) {
    var pr = D.pairRate || {};
    // Card sum'ga komissiyali almashtirishda asl (bozor) kurs kerak: Cash sum'ga almashtirish kursidan olamiz
    var r = (feeApplies(f, t) ? (pr[f + '>Cash sum'] || pr['Cash dollar>Cash sum'] || pr[f + '>' + t]) : (pr[f + '>' + t] || pr[t + '>' + f])) || D.lastRate;
    return r ? String(round2(r)) : '';
  }

  /* ---------- API ---------- */
  function api(action, payload, timeoutMs) {
    var body = Object.assign({ action: action, initData: tg.initData }, payload || {});
    var ctrl = window.AbortController ? new AbortController() : null;
    var tm = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 30000) : 0;
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('Server javobi: ' + r.status); return r.json(); })
      .then(function (j) {
        clearTimeout(tm);
        if (!j.ok) { var er = new Error(j.error || 'Nomaʼlum xatolik'); er.server = true; throw er; }
        return j;
      }, function (e) { clearTimeout(tm); throw e; });
  }
  // Eski Apps Script (yangi amal yoʻq) boʻlsa tushunarli xabar
  function apiHint(e) {
    return /Nomaʼlum amal/.test(e.message) ? 'Apps Script kodini (Code.gs) yangilang va yangi versiya chiqaring.' : e.message;
  }

  /* ---------- internet yoʻq boʻlsa: navbat ----------
     Yozuv telefonda saqlanadi va internet qaytganda oʻzi yuboriladi. Har yozuvning uid'i bor:
     server uni ikkinchi marta yozmaydi (javob yoʻqolib, qayta yuborilsa ham). */
  var QUEUE_KEY = 'pb-queue-v1:' + API_URL, flushing = false, flushTimer = 0;
  function readQueue() { if (!LIVE) return []; try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
  function writeQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
  function newUid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function isNetErr(e) {
    return !!e && !e.server && (e.name === 'TypeError' || e.name === 'AbortError' || e.name === 'SyntaxError' || /Server javobi/.test(e.message));
  }
  function pendingRec(entry) {
    return { sheet: entry.type === 'in' ? 'in' : 'out', row: null, pending: true, uid: entry.uid, date: entry.date, cat: entry.category,
      amount: entry.amount, wallet: entry.wallet, to: entry.to || '', rate: entry.rate || null, note: entry.note || '' };
  }
  // Server bergan qoldiq + hali yuborilmagan yozuvlar
  function withPending(b) {
    var c = Object.assign({}, b || {});
    readQueue().forEach(function (e) { applyBalances(c, e, 1); });
    return c;
  }
  function setBase(b) { D.baseBalances = b; D.balances = withPending(b); }
  function applyQueueToRecent() {
    D.recent = (D.recent || []).filter(function (x) { return !x.pending; });
    readQueue().forEach(function (e) { D.recent.unshift(pendingRec(e)); });
  }
  function scheduleFlush() { clearTimeout(flushTimer); if (readQueue().length) flushTimer = setTimeout(flushQueue, 20000); }
  function flushQueue() {
    if (!LIVE || flushing || !readQueue().length || !S.ready) return;
    flushing = true;
    var sent = 0;
    var next = function () {
      var q = readQueue();
      if (!q.length) return Promise.resolve();
      var entry = q[0];
      return api('add', { entry: entry }).then(function (r) {
        writeQueue(readQueue().slice(1)); sent++;
        setBase(r.balances); if (r.budgets) D.budgets = r.budgets;
        var i = -1;
        D.recent.forEach(function (x, j) { if (i < 0 && x.pending && x.uid === entry.uid) i = j; });
        if (i >= 0) {
          var was = D.recent[i]; D.recent[i] = r.saved;
          if (S.lastSaved === was) S.lastSaved = r.saved;
          if (S.lastGroup) S.lastGroup = S.lastGroup.map(function (x) { return x === was ? r.saved : x; });
        } else D.recent.unshift(r.saved);
        return next();
      }, function (e) {
        if (isNetErr(e)) throw e;
        writeQueue(readQueue().slice(1));          // server rad etdi: navbatni toʻsmasin
        D.recent = D.recent.filter(function (x) { return !(x.pending && x.uid === entry.uid); });
        D.balances = withPending(D.baseBalances);
        toast('Navbatdagi yozuv saqlanmadi: ' + e.message, 'error');
        return next();
      });
    };
    next().then(function () {
      flushing = false; writeCache(); render();
      if (sent) toast(sent + ' ta navbatdagi yozuv sheetga yuborildi', 'ok');
    }, function () { flushing = false; render(); scheduleFlush(); });
  }

  function applyBalances(b, entry, sign) {
    var amt = entry.amount, w = entry.wallet;
    if (entry.type === 'in' || entry.sheet === 'in') b[w] += sign * amt;
    else if (entry.to) { b[w] -= sign * amt; b[entry.to] += sign * convert(amt, w, entry.to, entry.rate || D.lastRate); }
    else b[w] -= sign * amt;
  }

  /* ---------- validation ---------- */
  function validity() {
    var amt = total(S.amount);
    if (S.mode === 'ex') {
      if (!S.from || !S.to) return { ok: false, msg: 'Hamyonlarni tanlang' };
      if (S.from === S.to) return { ok: false, msg: 'Ikki xil hamyon tanlang' };
      if (!(amt > 0)) return { ok: false, msg: 'Summani kiriting' };
      var rate = parseFloat(S.rate);
      if (isUsd(S.from) !== isUsd(S.to) && !(rate > 0)) return { ok: false, msg: 'Kursni kiriting' };
      if (feeApplies(S.from, S.to) && !S.edit && S.fee === 'got') { var gp = gotProblem(amt, rate); if (gp) return { ok: false, msg: gp }; }
      return { ok: true, msg: 'Saqlash · ' + money(amt, S.from) + ' → ' + money(exchangeNet(amt, S.from, S.to, rate, S.fee, total(S.got)), S.to) };
    }
    if (!(amt > 0)) return { ok: false, msg: 'Summani kiriting' };
    if (!S.cat[S.mode]) return { ok: false, msg: 'Kategoriyani tanlang' };
    if (!S.wallet[S.mode]) return { ok: false, msg: 'Hamyonni tanlang' };
    return { ok: true, msg: 'Saqlash · ' + money(amt, S.wallet[S.mode]) };
  }

    if (field === 'amount' && S.prefilled) { S.prefilled = false; if (k !== '+') v = ''; if (k === 'back' || k === 'clear') { S.amount = ''; haptic('select'); renderAmount(); renderSave(); return; } }

  function persistExchange(entry) {

    delete ex.feePct; delete ex.got;
    var nominal = ex.rate;
    var exact = feeApplies(ex.wallet, ex.to) && nominal > 0 && recv > 0;
    var on = feeApplies(ex.wallet, ex.to) && nominal > 0 && (pct > 0 || exact);
    var gross = convert(ex.amount, ex.wallet, ex.to, nominal || D.lastRate);
    var rNet = exact ? Math.round(recv / ex.amount) : effRate(nominal, pct);
    var net = on ? ex.amount * rNet : gross;
    var fee = on ? gross - net : 0;
    var plain = function (n, d) { return fmtNum(n, d).replace(/[\u202F\u00A0]/g, ' '); };
    if (exact) pct = round2((gross / recv - 1) * 100);
    else if (on) rememberFee(pct);
    if (on) {
      ex.rate = rNet;
      ex.note = 'Kurs ' + plain(nominal, 2) + (pct > 0 ? ', komissiya ' + pctLabel(pct) : '') +
        (exact ? ', kartaga ' + plain(recv, 2) : '') + (ex.note ? ' · ' + ex.note : '');
    }
    return persist(ex).then(function (rec) {
      if (on) D.pairRate[ex.wallet + '>' + ex.to] = nominal;   // keyingi safar asl kurs taklif qilinsin
      writeCache();
      return { fee: fee, net: net, pct: pct, pending: !!rec.pending };

        if (j < toks.length && !toks[j].used && USDW.test(toks[j].t)) { ent.cur = 'USD'; j++; }

    function matchCategory(rest, type, ctx) {
      var lists = type === 'in' ? [['in', ctx.inCats]] : type === 'out' ? [['out', ctx.outCats]] : [['out', ctx.outCats], ['in', ctx.inCats]];

      var syn = {};
      rest.forEach(function (r, idx) {

            var key = clean(SYN[k]); (syn[key] = syn[key] || []).push(idx);
          }

      });
      var best = null;
      lists.forEach(function (L) {
        L[1].forEach(function (name) {
          if (name === 'Exchange') return;
          var cn = clean(name), score = 0, used = [], sig = 0, hit = 0;
          var exact = !!cn && text.indexOf(' ' + cn + ' ') >= 0;
          cn.split(' ').forEach(function (w0) {
            if (w0.length < 3 || GENERIC.indexOf(' ' + w0 + ' ') >= 0) return;

            });
            if (got) hit++;

          if (exact) cn.split(' ').forEach(function (w) { var ix = rest.indexOf(w); if (ix >= 0 && used.indexOf(ix) < 0) used.push(ix); });
          // Asosiy soʻzlari toʻliq aytilgan nom yutadi; koʻproq soʻzi mos kelgani ("lunch with my family") qisqasidan ("Lunch") ustun
          if (exact || (sig && hit === sig)) score = 100 + 10 * hit + (exact ? 5 : 0);
          if (syn[cn] && score < 100) { score += 60; used = used.concat(syn[cn]); }
          if (!score) return;
          var u = (ctx.usage && ctx.usage[L[0]] && ctx.usage[L[0]][name]) || 0;
          if (!best || score > best.score || (score === best.score && u > best.u)) best = { name: name, type: L[0], score: score, u: u, used: used };
        });

      return best && best.score >= 10 ? best : null;

    function parseSeg(raw, ctx) {
      raw = String(raw);
      var fee = null, fm = raw.match(/(\d+(?:[.,]\d+)?)\s*(?:%|foiz|percent|процент)/i) || raw.match(/(?:komissiya\w*|комисси\w*|commission)\s+(\d+(?:[.,]\d+)?)/i);
      if (fm) { fee = parseFloat(fm[1].replace(',', '.')); raw = raw.replace(fm[0], ' '); }
      if (/komissiyasiz|без\s+комисси|no\s+fee|without\s+fee/i.test(raw)) fee = 0;
      raw = raw.replace(/komissiya\w*|комисси\w*|commission/gi, ' ');
      var toks = tokenize(raw);
      var e = { type: null, category: null, amount: 0, wallet: null, to: null, rate: null, date: ctx.today, note: '' };
      toks.forEach(function (k) {
        var w = k.t;
        if (/^(exchange|almashtir|ayirbosh|obmen|обмен|konvert|convert)/.test(w)) { e.type = 'exchange'; k.used = true; }
        else if (/^(kirim|income|tushum|daromad|приход)/.test(w)) { e.type = 'in'; k.used = true; }
        else if (w === 'chiqim' || w === 'расход') { k.used = true; }
        else if (w === 'bugun' || w === 'today' || w === 'сегодня') { k.used = true; }
        else if (w === 'kecha' || w === 'yesterday' || w === 'вчера') { e.date = shift(ctx.today, -1); k.used = true; }
      });
      for (var i = 0; i + 1 < toks.length; i++) {
        if (/^o'?tgan$/.test(toks[i].t) && /^kun/.test(toks[i + 1].t)) { e.date = shift(ctx.today, -2); toks[i].used = toks[i + 1].used = true; }
      }
      var ws = findWallets(toks);
      var distinct = ws.map(function (x) { return x.w; }).filter(function (w, ix, a) { return a.indexOf(w) === ix; });
      if (!e.type && distinct.length >= 2) e.type = 'exchange';
      var nums = findNumbers(toks), amt = null, rate = null;
      // "100 dollar kartaga 12000": dollar summa soʻm hamyonga "-ga" bilan → bu almashtirish
      if (!e.type && ws.length === 1 && ws[0].role === 'to' && ws[0].w !== 'CASH') {

      var cashBy = function (c) { return c === 'USD' ? 'Cash dollar' : 'Cash sum'; };

      if (e.type === 'exchange') {

        ws.forEach(function (x) { if (x.role === 'to' && !to) to = x; else if (x.role === 'from' && !from) from = x; });
        ws.forEach(function (x) { if (x !== from && x !== to) { if (!from) from = x; else if (!to) to = x; } });
        var fw = from ? (from.w === 'CASH' ? cashBy(cur) : from.w) : null;
        var tw = to ? to.w : null;
        if (tw === 'CASH') tw = (!fw || fw === 'Cash dollar' || fw === 'Card sum' || fw === 'Cash sum') ? 'Cash sum' : 'Cash dollar';
        if (!fw && cur === 'USD' && tw !== 'Cash dollar') fw = 'Cash dollar';
        if (!fw && cur === 'UZS' && tw && tw !== 'Cash sum') fw = 'Cash sum';
        e.category = 'Exchange'; e.wallet = fw; e.to = tw && tw !== fw ? tw : null;
        e.rate = rate && rate.v >= 100 ? rate.v : null;
        e.fee = fee;
        return e;
      }
      var w0 = ws[0] ? ws[0].w : null;
      e.wallet = w0 === 'CASH' ? cashBy(cur) : (w0 || (cur === 'USD' ? 'Cash dollar' : null));
      var rest = toks.map(function (x) { return x.used ? null : x.t; });
      var m = matchCategory(rest, e.type, ctx);
      if (m) { e.category = m.name; e.type = e.type || m.type; m.used.forEach(function (ix) { rest[ix] = null; }); }

    function parse(text, ctx) {
      var src = String(text || '')
        .replace(/\b(hundred|thousand|million|yuz|ming)\s+and\s+/gi, '$1 ')     // "one hundred and twenty"
        .replace(/\s+and\s+a\s+half\b/gi, ' half')                               // "one and a half million"
        .replace(/(\d)\s*k\b/gi, '$1k');

      return segs.map(function (s) { return parseSeg(s, ctx); }).filter(function (e) { return e.amount > 0; });

  })();
  /* PARSER END */

  function normVoice(e) {

      date: /^\d{4}-\d{2}-\d{2}$/.test(e.date || '') ? e.date : iso(new Date()), note: e.note || '' };

      if (x.to === x.wallet) x.to = null;
      var cross = x.wallet && x.to && isUsd(x.wallet) !== isUsd(x.to);

    else return;
    var b = el.recurBody.querySelector('.r-save'), pr = recurProblem();
    if (b) { b.disabled = !!pr || R.busy; b.textContent = pr || ((recurOf(R.cat) ? 'Oʻzgartirish · ' : 'Eslatmaga qoʻshish · ') + 'har oy ' + Number(R.day) + '-sanada'); }
  });
  el.recurBody.addEventListener('change', function (e) { if (e.target.id === 'rCat' && e.target.value) { recurPick(e.target.value); renderRecurSheet(); } });
  el.voiceBody.addEventListener('keydown', function (e) {
    if (e.target.id === 'cmdText' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
  });

  // iPhone: klaviatura ochilganda pastdagi oynani klaviatura ustiga koʻtaramiz
  // iPhone klaviaturasi ochilganda oynani koʻrinib turgan qismning tepasiga bogʻlaymiz: shunda u surilib ketmaydi
  function fitSheetsToKeyboard() {
    var vv = window.visualViewport;
    if (!vv) return;
    var open = window.innerHeight - vv.height > 120;
    [el.sheet, el.voiceSheet, el.recurSheet].forEach(function (sh) {
      sh.style.top = open ? Math.round(vv.offsetTop + 8) + 'px' : '';
      sh.style.bottom = open ? 'auto' : '';
      sh.style.maxHeight = open ? Math.round(vv.height - 16) + 'px' : '';
      sh.style.borderRadius = open ? '18px' : '';
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheetsToKeyboard);
    window.visualViewport.addEventListener('scroll', fitSheetsToKeyboard);
  }
  el.save.addEventListener('click', save);
  el.dates.addEventListener('change', function (e) {
    if (e.target.id === 'dateInput' && e.target.value) { S.date = e.target.value; renderDates(); }
  });
  el.note.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.note.blur(); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (S.sheetOpen && tag !== 'input' && tag !== 'textarea') {
      if (e.key === 'Escape') closeTop();
      else if (/^[a-z]$/i.test(e.key) && !e.metaKey && !e.ctrlKey) typeSearch(e.key.toLowerCase());
      else if (e.key === 'Backspace') typeSearch('back');
      else if (e.key === ' ') typeSearch(' ');
      else return;
      e.preventDefault(); return;
    }
    if (tag === 'input' || tag === 'textarea' || S.sheetOpen || V.open) { if (e.key === 'Escape') closeTop(); return; }
    if (e.key === 'Escape') { closeKb(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('amount')) { e.preventDefault(); openKb(); return; }
    if (/^[0-9]$/.test(e.key) && !S.kb) openKb();
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === '+') press('+');
    else if (e.key === '.' || e.key === ',') press('.');
    else if (e.key === 'Enter') save();
    else return;
    e.preventDefault();
  });

  /* ---------- telegram + boot ---------- */
  function syncTgHeader() {
    if (!tg) return;
    try { tg.setHeaderColor(cssVar('--wash')); } catch (e) {}
  }
  function setupTelegram() {
    if (!tg) return;
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    var theme = function () {
      syncTgHeader();
      try { tg.setBackgroundColor(cssVar('--bg')); } catch (e) {}
      try { if (tg.setBottomBarColor) tg.setBottomBarColor(cssVar('--surface')); } catch (e) {}
      if (S.ready) renderSave();
    };
    theme();
    try { tg.onEvent('themeChanged', theme); } catch (e) {}
    if (IN_TG) {
      try { tg.MainButton.onClick(save); } catch (e) {}
      try { tg.BackButton.onClick(closeTop); } catch (e) {}
    }
  }

  function showState(kind, msg) {
    el.form.hidden = kind !== 'ready';
    el.state.hidden = kind === 'ready';
    if (kind === 'loading') el.state.innerHTML = '<strong>Sheet yuklanmoqda…</strong><span>Hamyonlar va kategoriyalar olinmoqda</span>';
    if (kind === 'error') el.state.innerHTML = '<strong>Sheetga ulanib boʻlmadi</strong><span>' + esc(msg) + '</span><button data-act="retry">Qayta urinish</button>';
  }

  function setDefaults() {
    S.date = iso(new Date());
    S.wallet.out = (D.defaultWallet && D.defaultWallet.out) || D.wallets[0];
    S.wallet.in = (D.defaultWallet && D.defaultWallet.in) || D.wallets[0];
    var pair = D.exPair && D.exPair.length === 2 ? D.exPair : [D.wallets[1] || D.wallets[0], D.wallets[0]];
    S.from = pair[0]; S.to = pair[1];
    S.rate = rateFor(S.from, S.to);
    S.fee = defaultFee(S.from, S.to);
    D.pairRate = D.pairRate || {};
  }

  // Oxirgi maʼlumot telefonda saqlanadi: ilova darhol ochiladi, sheetdan yangisi orqa fonda keladi
  var CACHE_KEY = 'pb-init-v1:' + API_URL;
  function readCache() {
    try { var j = localStorage.getItem(CACHE_KEY); var d = j ? JSON.parse(j) : null; return d && d.wallets && d.outCats ? d : null; }
    catch (e) { return null; }
  }
  function writeCache() {
    if (!LIVE || !D) return;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
  }
  // Yangi maʼlumot kelganda foydalanuvchi tanlab turganlarini saqlab qolamiz
  function keepSelections() {
    D.pairRate = D.pairRate || {};
    ['out', 'in'].forEach(function (m) {
      if (D.wallets.indexOf(S.wallet[m]) < 0) S.wallet[m] = (D.defaultWallet && D.defaultWallet[m]) || D.wallets[0];
    });
    var outNames = D.outCats.map(function (c) { return c.name; });
    if (S.cat.out && outNames.indexOf(S.cat.out) < 0) S.cat.out = null;
    if (S.cat.in && D.inCats.indexOf(S.cat.in) < 0) S.cat.in = null;
    if (D.wallets.indexOf(S.from) < 0 || D.wallets.indexOf(S.to) < 0) { var pr = D.exPair || [D.wallets[1], D.wallets[0]]; S.from = pr[0]; S.to = pr[1]; }
    var remap = function (ls) {
      var match = null;
      D.recent.forEach(function (x) { if (!match && x.sheet === ls.sheet && x.row === ls.row) match = x; });
      return match;
    };
    if (S.lastSaved) S.lastSaved = S.lastSaved.pending ? S.lastSaved : remap(S.lastSaved);
    if (S.edit) { S.edit = remap(S.edit); if (!S.edit) endEdit(); }
    if (S.lastGroup) { S.lastGroup = S.lastGroup.map(remap).filter(Boolean); if (!S.lastGroup.length) S.lastGroup = null; }
  }

  function boot() {
    S.ready = false; S.kb = false;
    if (!LIVE) {
      D = demoData();
      el.demo.hidden = false;
      setDefaults(); S.ready = true; showState('ready'); render();
      return;
    }
    var cached = readCache();
    if (cached) {
      D = cached; setBase(D.baseBalances || D.balances); applyQueueToRecent();
      setDefaults(); S.ready = true; S.stale = true; showState('ready');
    }
    else showState('loading');
    el.sync.hidden = !S.stale;
    render();
    api('init').then(function (r) {
      var first = !S.ready;
      D = r; setBase(r.balances); applyQueueToRecent();
      if (first) setDefaults(); else keepSelections();
      writeCache();
      S.ready = true; S.stale = false; el.sync.hidden = true;
      showState('ready'); render();
      flushQueue();
    }).catch(function (e) {
      S.stale = false; el.sync.hidden = true;
      if (S.ready) toast('Sheetdan yangilab boʻlmadi. ' + e.message, 'error');
      else showState('error', e.message);
      render();
    });
  }

  setupTelegram();
  boot();
})();
</script>
</body>
</html>
