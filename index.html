<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Personal Budjet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: mode switch on top · scrolling form (wallets, amount, category, date, recent) · keypad docked at the bottom.
   The accent colour follows the entry type: rust = chiqim, green = kirim, blue = almashtirish. */
:root {
  --bg: #EEF1EF;
  --surface: #FFFFFF;
  --sunken: #E3E8E5;
  --ink: #15201C;
  --muted: #5B6863;
  --line: #D6DDD9;
  --out: #B3431D;
  --in: #1C774A;
  --ex: #2B57B0;
  --accent: var(--out);
  --on-accent: #FFFFFF;
  /* Rejim rangi ekran tepasida yengil fon boʻlib turadi */
  --wash-out: #F6E7DE; --wash-in: #E0EFE6; --wash-ex: #E2E8F6;
  --wash: var(--wash-out);
  /* Har bir hamyonning oʻz rangi (hamma joyda bir xil) */
  --w-cash-sum: #1D7A66; --w-card-sum: #3A62B5; --w-cash-usd: #5F7D1D; --w-visa: #2E3F92; --w-master: #BF561C;
  --danger: #B42318;
  --on-danger: #FFFFFF;
  --toast: #15201C;
  --on-toast: #EEF1EF;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1210; --surface: #161D1A; --sunken: #1F2724; --ink: #E6ECE9; --muted: #92A09A; --line: #28322E;
    --out: #EE7A4E; --in: #4CC189; --ex: #82A4F3; --on-accent: #0D1210;
    --danger: #F97066; --on-danger: #0D1210; --toast: #E6ECE9; --on-toast: #0D1210;
    --wash-out: #2B1C15; --wash-in: #12271C; --wash-ex: #172037;
    --w-cash-sum: #4CC0A4; --w-card-sum: #86A6F2; --w-cash-usd: #AAC867; --w-visa: #96A3F2; --w-master: #F08C58;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1210; --surface: #161D1A; --sunken: #1F2724; --ink: #E6ECE9; --muted: #92A09A; --line: #28322E;
  --out: #EE7A4E; --in: #4CC189; --ex: #82A4F3; --on-accent: #0D1210;
  --danger: #F97066; --on-danger: #0D1210; --toast: #E6ECE9; --on-toast: #0D1210;
  --wash-out: #2B1C15; --wash-in: #12271C; --wash-ex: #172037;
  --w-cash-sum: #4CC0A4; --w-card-sum: #86A6F2; --w-cash-usd: #AAC867; --w-visa: #96A3F2; --w-master: #F08C58;
  color-scheme: dark;
}
body[data-mode="out"] { --wash: var(--wash-out); }
body[data-mode="in"] { --accent: var(--in); --wash: var(--wash-in); }
body[data-mode="ex"] { --accent: var(--ex); --wash: var(--wash-ex); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }

.app { height: 100%; display: flex; flex-direction: column; position: relative;
  background: var(--bg); background: linear-gradient(180deg, var(--wash) 0, var(--wash) 56px, var(--bg) 340px); transition: background .25s; }

/* top */
.top { flex: none; padding-block: 10px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 12px;
  background: var(--sunken); background: color-mix(in srgb, var(--accent) 10%, var(--sunken)); }
.seg button { height: 36px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.demo { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.demo b { color: var(--ink); font-weight: 600; }

/* scroll area */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 6px 18px; padding-left: var(--gut-l); padding-right: var(--gut-r);
}
.form { display: flex; flex-direction: column; gap: 16px; }
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.link { font-size: 13px; font-weight: 600; color: var(--accent); }

/* wallets */
.hscroll {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-left: calc(-1 * var(--gut-l)); margin-right: calc(-1 * var(--gut-r));
  padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 1px;
}
.hscroll::-webkit-scrollbar { display: none; }
.wallet {
  --wc: var(--muted);
  flex: none; min-width: 108px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 8px 12px; border-radius: 12px; text-align: left; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--wc) 5%, var(--surface));
}
.wallet .w-name { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.wallet .w-name::before, .wdot { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--wc); margin-right: 6px; vertical-align: 1px; }
.wallet .w-bal { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wallet .w-bal.neg { color: var(--danger); }
.wallet[aria-pressed="true"] { border-color: var(--wc); box-shadow: inset 0 0 0 1px var(--wc);
  background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
.wallet[aria-pressed="true"] .w-name { color: var(--wc); }
.wallet:disabled { opacity: .38; cursor: default; }
.ex-rows { display: flex; flex-direction: column; gap: 6px; }
.ex-row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.swap { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); }
.swap svg { width: 16px; height: 16px; }

/* amount */
.amount { padding: 12px 16px 12px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--accent) 5%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 22%, var(--line)); }
.amount .amt-cur, .f-val .amt-cur { color: var(--accent); }
.amt { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 6px; min-height: 48px;
  font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.amt.long { font-size: 28px; min-height: 48px; }
.amt.empty .amt-val { color: var(--muted); opacity: .55; }
.amt-cur { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.caret { display: inline-block; width: 2px; height: .9em; background: var(--accent); align-self: center; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .seg button, .app { transition: none; } }
.amt-hint { display: flex; flex-wrap: wrap; column-gap: 10px; font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.amt-hint b { font-weight: 600; color: var(--ink); }

.ex-fields { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 8px; }
.ex-fields.single { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding: 10px 12px; text-align: left;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.field[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.f-lbl { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.f-val { display: flex; align-items: baseline; gap: 4px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.f-val.empty { color: var(--muted); opacity: .55; }
.f-val .amt-cur { font-size: 14px; }
.ex-out { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; padding: 10px 12px;
  border-radius: 12px; font-size: 13px; color: var(--muted);
  background: var(--sunken); background: color-mix(in srgb, var(--accent) 11%, var(--surface)); }
.ex-out b { font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; max-width: 100%;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.sm { height: 34px; padding: 0 12px; font-size: 13.5px; }
.chip svg { width: 15px; height: 15px; flex: none; }
.chip input[type="date"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.meta { display: flex; flex-direction: column; gap: 10px; }
.note { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.note::placeholder { color: var(--muted); }

/* recent */
.recent { list-style: none; margin: 0; padding: 0; }
.rec { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; }
.rec[data-kind="out"] { --k: var(--out); }
.rec[data-kind="in"] { --k: var(--in); }
.rec[data-kind="ex"] { --k: var(--ex); }
.dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--k);
  background: var(--sunken); background: color-mix(in srgb, var(--k) 14%, transparent); }
.dot svg { width: 15px; height: 15px; }
.rec-main { min-width: 0; }
.rec-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.rec[data-kind="in"] .rec-amt { color: var(--in); }
.rec .undo { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--accent); }
.rec.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 12%, transparent); } to { background: transparent; } }
.empty-note { margin: 0; color: var(--muted); font-size: 13px; }

.state { padding: 48px 8px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.state strong { color: var(--ink); font-size: 16px; }
.state button { height: 40px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* dock */
.dock { flex: none; position: relative; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gut-l); padding-right: var(--gut-r); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.keypad button { height: 48px; border-radius: 12px; background: var(--sunken); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;
  display: grid; place-items: center; transition: transform .06s; }
.keypad button:active { transform: scale(.96); background: var(--line); }
.keypad .op { font-size: 17px; color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--sunken)); }
.keypad .wide { grid-column: span 2; }
.keypad button:disabled { opacity: .3; }
.keypad svg { width: 24px; height: 24px; }
.save { margin-top: 8px; width: 100%; height: 50px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; }
.save:disabled { background: var(--sunken); color: var(--muted); cursor: default; }
@media (max-height: 640px) {
  .keypad button { height: 42px; }
  .amt { font-size: 34px; min-height: 40px; }
  .form { gap: 12px; }
}

.toast {
  position: absolute; left: var(--gut-l); right: var(--gut-r); bottom: calc(100% + 10px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-radius: 12px; background: var(--toast); color: var(--on-toast); font-size: 14px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .18);
}
.toast.error { background: var(--danger); color: var(--on-danger); }
.toast span { min-width: 0; }
.toast button { flex: none; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; color: inherit; }

/* voice */
.top-row { display: flex; align-items: center; gap: 8px; }
.top-row .seg { flex: 1; min-width: 0; }
.mic-btn { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); }
.mic-btn svg { width: 22px; height: 22px; }
.mic-btn:disabled { background: var(--sunken); color: var(--muted); }
.pending { margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 12px; border-radius: 10px; background: var(--sunken); font-size: 13px; font-weight: 600; text-align: left; }
.pending span:last-child { color: var(--accent); }
.voice-body { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 0; flex: 1 1 auto; overflow-y: auto;
  text-align: center; padding-top: 4px; }
.cmd-out { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.orb { position: relative; width: 104px; height: 104px; margin-top: 10px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); }
.orb svg { width: 40px; height: 40px; }
.orb::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 3px solid var(--accent); opacity: .35;
  transform: scale(var(--lvl, 1)); transition: transform .08s linear; }
.timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.voice-hint { margin: 0; max-width: 34ch; font-size: 13px; color: var(--muted); }
.voice-hint q, .voice-hint b { color: var(--ink); font-weight: 500; }
.voice-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.btn { height: 48px; border-radius: 14px; background: var(--sunken); font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
.spinner { width: 42px; height: 42px; margin-top: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .orb::before { transition: none; } }
.voice-body strong { font-size: 16px; }
.transcript { width: 100%; margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--sunken); text-align: left; font-size: 14px; }
.transcript::before { content: "«"; } .transcript::after { content: "»"; }
.v-list { width: 100%; list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; text-align: left; }
.rec.v { grid-template-columns: 30px minmax(0, 1fr) auto 30px; cursor: pointer; }
.rec.v.nox { grid-template-columns: 30px minmax(0, 1fr) auto; }
.rec .x { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.rec .x svg { width: 16px; height: 16px; }
.miss { color: var(--danger); font-weight: 600; }
.v-tip { margin: 0; width: 100%; font-size: 12.5px; color: var(--muted); text-align: left; }
.cmd { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.cmd textarea { width: 100%; min-height: 76px; resize: none; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); font: inherit; font-size: 17px; line-height: 1.35; }
.cmd textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.examples { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.examples .chip { height: 32px; font-size: 13px; color: var(--muted); }
.rec-mic { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.rec-mic svg { width: 20px; height: 20px; }
.linkish { font-size: 14px; font-weight: 600; color: var(--accent); padding: 6px 4px; }

/* category sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .4); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82%; display: flex; flex-direction: column;
  border-radius: 18px 18px 0 0; background: var(--surface);
  padding-block: 14px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gut-l); padding-right: var(--gut-r);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.search { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.cat-list { list-style: none; margin: 8px 0 0; padding: 0; overflow-y: auto; min-height: 0; }
.cat-list button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.cat-list button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.cat-tip { flex: none; font-size: 12px; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="seg" role="tablist" aria-label="Yozuv turi">
        <button role="tab" id="tab-out" data-set-mode="out" aria-selected="true">Chiqim</button>
        <button role="tab" id="tab-in" data-set-mode="in" aria-selected="false">Kirim</button>
        <button role="tab" id="tab-ex" data-set-mode="ex" aria-selected="false">Almashtirish</button>
      </div>
      <button class="mic-btn" id="micBtn" data-act="voice" aria-label="Ovoz bilan kiritish" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
    </div>
    <button class="pending" id="pendingBtn" data-act="voice-review" hidden></button>
    <p class="demo" id="demoNote" hidden><b>Namuna rejimi.</b> Maʼlumot sheetga yozilmaydi.</p>
  </header>

  <main class="scroll" id="scroll">
    <section class="state" id="state" hidden></section>
    <div class="form" id="form">
      <section id="walletBlock" aria-label="Hamyon"></section>
      <section id="amountBlock" aria-label="Summa"></section>
      <section id="catBlock" aria-label="Kategoriya"></section>
      <section class="meta" aria-label="Sana va izoh">
        <div class="chips" id="dates"></div>
        <input class="note" id="note" type="text" placeholder="Izoh (ixtiyoriy)" autocomplete="off" maxlength="200" enterkeyhint="done">
      </section>
      <section id="recentBlock" aria-label="Oxirgi yozuvlar"></section>
    </div>
  </main>

  <footer class="dock" id="dock">
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="back" class="op" aria-label="Oxirgi raqamni oʻchirish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg></button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="+" class="op" aria-label="Qoʻshish">+</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="000" class="op">000</button>
      <button data-k="." aria-label="Kasr">,</button><button data-k="0" class="wide">0</button>
      <button data-k="clear" class="op" aria-label="Tozalash">C</button>
    </div>
    <button class="save" id="saveBtn" disabled>Saqlash</button>
  </footer>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="catSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head">
      <h2 id="sheetTitle">Kategoriyalar</h2>
      <button class="icon-btn" data-act="close-sheet" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <input class="search" id="catSearch" type="search" placeholder="Qidirish…" autocomplete="off">
    <ul class="cat-list" id="catList"></ul>
  </div>

  <div class="sheet" id="voiceSheet" role="dialog" aria-modal="true" aria-labelledby="voiceTitle" hidden>
    <div class="sheet-head">
      <h2 id="voiceTitle">Tez kiritish</h2>
      <button class="icon-btn" data-act="voice-close" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="voice-body" id="voiceBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===== SOZLAMA =====
     Apps Script Web App manzili (…/exec bilan tugaydi). Boʻsh qolsa, ilova namuna rejimida ishlaydi. */
  var API_URL = '';

  var USD_WALLETS = ['Cash dollar', 'Visa', 'Master card'];
  var EXCHANGE = 'Exchange';

  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var IN_TG = !!(tg && tg.initData);
  var LIVE = !!(API_URL && IN_TG);

  var $ = function (s) { return document.querySelector(s); };
  var el = {
    form: $('#form'), state: $('#state'), wallet: $('#walletBlock'), amount: $('#amountBlock'), cat: $('#catBlock'),
    dates: $('#dates'), note: $('#note'), recent: $('#recentBlock'), keypad: $('#keypad'), save: $('#saveBtn'),
    toast: $('#toast'), sheet: $('#catSheet'), sheetBg: $('#sheetBg'), search: $('#catSearch'), catList: $('#catList'),
    demo: $('#demoNote'), scroll: $('#scroll'),
    voiceSheet: $('#voiceSheet'), voiceBody: $('#voiceBody'), mic: $('#micBtn'), pending: $('#pendingBtn')
  };
  var VOICE_MAX_SEC = 60;
  // Ovoz holati: idle | input | rec | busy | review | error
  var V = { open: false, state: 'idle', entries: [], transcript: '', error: '', text: '', source: 'voice', stream: null, rec: null, chunks: [],
            ac: null, analyser: null, raf: 0, timer: 0, t0: 0, cancelled: false };

  var S = {
    mode: 'out', amount: '', rate: '', focus: 'amount',
    wallet: { out: null, in: null }, touched: { out: false, in: false },
    cat: { out: null, in: null }, from: null, to: null,
    date: null, busy: false, ready: false, lastSaved: null, sheetOpen: false
  };
  var D = null;
  var toastTimer = null;
  var demoRow = 5000;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function isUsd(w) { return USD_WALLETS.indexOf(w) >= 0; }
  function group(i) { return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function fmtNum(n, maxDec) {
    if (!isFinite(n)) return '—';
    var neg = n < 0; n = Math.abs(n);
    var p = Math.pow(10, maxDec);
    var s = (Math.round(n * p) / p).toFixed(maxDec);
    if (maxDec > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    var parts = s.split('.');
    return (neg ? '−' : '') + group(parts[0]) + (parts[1] ? ',' + parts[1] : '');
  }
  function money(n, w) { return isUsd(w) ? '$' + fmtNum(n, 2) : fmtNum(n, 0) + ' soʻm'; }
  function total(expr) { return String(expr || '').split('+').reduce(function (s, t) { return s + (parseFloat(t) || 0); }, 0); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function showExpr(expr) {
    if (!expr) return '0';
    return expr.split('+').map(function (t) {
      if (t === '') return '';
      var p = t.split('.');
      return group(p[0] || '0') + (p.length > 1 ? ',' + p[1] : '');
    }).join(' + ');
  }
  function iso(d) { var z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function shiftIso(s, days) { var p = s.split('-').map(Number); return iso(new Date(p[0], p[1] - 1, p[2] + days)); }
  function ddmm(s) { var p = String(s).split('-'); if (p.length < 3) return s; return p[2] + '.' + p[1] + (Number(p[0]) !== new Date().getFullYear() ? '.' + p[0] : ''); }
  function convert(amount, from, to, rate) {
    var fu = isUsd(from), tu = isUsd(to);
    if (fu === tu) return amount;
    if (!(rate > 0)) return NaN;
    return fu ? amount * rate : amount / rate;
  }
  function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
  function haptic(kind) {
    if (!tg || !tg.HapticFeedback) return;
    try {
      if (kind === 'select') tg.HapticFeedback.selectionChanged();
      else if (kind === 'light') tg.HapticFeedback.impactOccurred('light');
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}
  }
  function rateFor(f, t) {
    var r = (D.pairRate && (D.pairRate[f + '>' + t] || D.pairRate[t + '>' + f])) || D.lastRate;
    return r ? String(round2(r)) : '';
  }

  var ICON = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg>',
    ex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };

  /* ---------- API ---------- */
  function api(action, payload) {
    var body = Object.assign({ action: action, initData: tg.initData }, payload || {});
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('Server javobi: ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Nomaʼlum xatolik'); return j; });
  }

  /* ---------- demo data (namuna; haqiqiy maʼlumot emas) ---------- */
  function demoData() {
    var today = iso(new Date()), yday = shiftIso(today, -1);
    // Namuna: tartib va odatdagi hamyon sheetdagi ishlatilishga qarab (sonlar faqat tartib uchun)
    var outNames = [
      ['Grocery ', 25, 'Cash sum'], ["Wife's expenses ", 24, 'Cash sum'], ['Charity', 23, 'Card sum'], ['Doctor', 22, 'Cash sum'],
      ['Medicine', 21, 'Cash sum'], ['Other', 20, 'Cash sum'], ['Lunch with family', 19, 'Cash sum'], ['Electricity', 18, 'Card sum'],
      ['Household expenses ', 17, 'Card sum'], ['Lunch', 16, 'Card sum'], ['Home cleaning', 15, 'Cash sum'],
      ['Personal clothing', 14, 'Cash sum'], ['Taxi', 13, 'Card sum'], ['School', 12, 'Cash sum'], ['Transfer fee', 11, 'Card sum'],
      ['Clothing ', 10, 'Cash sum'], ['Mobile payment ', 9, 'Card sum'], ['Barbershop ', 8, 'Cash sum'], ['Car wash ', 7, 'Cash sum'],
      ['Traffic fine', 6, 'Card sum'], ['Lunch with friends', 5, 'Cash sum'], ['Natural gas', 4, 'Card sum'],
      ['Parking fee', 3, 'Cash sum'], ['Internet', 2, 'Card sum'], ['Travel', 1, 'Cash dollar'], ['Zakot', 0, 'Cash dollar']
    ];
    var tips = { 'Travel': 'Medium-term expenses', 'Zakot': 'Long-term expenses' };
    var d = {
      wallets: ['Cash sum', 'Cash dollar', 'Card sum', 'Visa', 'Master card'],
      balances: { 'Cash sum': 3400000, 'Cash dollar': 1250, 'Card sum': 820000, 'Visa': 120.5, 'Master card': 15 },
      outCats: [{ name: EXCHANGE, tip: '' }], inCats: ['Transfer profit', 'Dividend', 'Car sale', 'Loan', 'Other'],
      usage: { out: {}, in: { 'Transfer profit': 20, 'Dividend': 14, 'Other': 9, 'Car sale': 5, 'Loan': 2 } },
      favWallet: { out: {}, in: {} }, defaultWallet: { out: 'Cash sum', in: 'Cash dollar' },
      exPair: ['Cash dollar', 'Cash sum'], lastRate: 12000, pairRate: { 'Cash dollar>Cash sum': 12000, 'Cash dollar>Card sum': 11950 },
      recent: [
        { sheet: 'out', row: 4999, date: today, cat: 'Grocery ', amount: 185000, wallet: 'Cash sum', to: '', rate: null, note: '' },
        { sheet: 'out', row: 4998, date: today, cat: EXCHANGE, amount: 100, wallet: 'Cash dollar', to: 'Cash sum', rate: 12000, note: '' },
        { sheet: 'out', row: 4997, date: yday, cat: 'Taxi', amount: 32000, wallet: 'Card sum', to: '', rate: null, note: '' },
        { sheet: 'in', row: 130, date: yday, cat: 'Dividend', amount: 1000, wallet: 'Cash dollar', to: '', rate: null, note: '' }
      ]
    };
    outNames.forEach(function (r) {
      d.outCats.push({ name: r[0], tip: tips[r[0]] || 'Short-term expenses' });
      d.usage.out[r[0]] = r[1]; d.favWallet.out[r[0]] = r[2];
    });
    return d;
  }
  function applyBalances(b, entry, sign) {
    var amt = entry.amount, w = entry.wallet;
    if (entry.type === 'in' || entry.sheet === 'in') b[w] += sign * amt;
    else if (entry.to) { b[w] -= sign * amt; b[entry.to] += sign * convert(amt, w, entry.to, entry.rate || D.lastRate); }
    else b[w] -= sign * amt;
  }
  function demoAdd(entry) {
    var b = Object.assign({}, D.balances);
    applyBalances(b, entry, 1);
    var saved = { sheet: entry.type === 'in' ? 'in' : 'out', row: ++demoRow, date: entry.date, cat: entry.category, amount: entry.amount,
      wallet: entry.wallet, to: entry.to || '', rate: entry.rate || null, note: entry.note };
    return new Promise(function (res) { setTimeout(function () { res({ saved: saved, balances: b }); }, 350); });
  }
  function demoUndo(rec) {
    var b = Object.assign({}, D.balances);
    applyBalances(b, rec, -1);
    return new Promise(function (res) { setTimeout(function () { res({ balances: b }); }, 250); });
  }

  /* ---------- validation ---------- */
  function validity() {
    var amt = total(S.amount);
    if (S.mode === 'ex') {
      if (!S.from || !S.to) return { ok: false, msg: 'Hamyonlarni tanlang' };
      if (S.from === S.to) return { ok: false, msg: 'Ikki xil hamyon tanlang' };
      if (!(amt > 0)) return { ok: false, msg: 'Summani kiriting' };
      var rate = parseFloat(S.rate);
      if (isUsd(S.from) !== isUsd(S.to) && !(rate > 0)) return { ok: false, msg: 'Kursni kiriting' };
      return { ok: true, msg: 'Saqlash · ' + money(amt, S.from) + ' → ' + money(convert(amt, S.from, S.to, rate), S.to) };
    }
    if (!(amt > 0)) return { ok: false, msg: 'Summani kiriting' };
    if (!S.cat[S.mode]) return { ok: false, msg: 'Kategoriyani tanlang' };
    if (!S.wallet[S.mode]) return { ok: false, msg: 'Hamyonni tanlang' };
    return { ok: true, msg: 'Saqlash · ' + money(amt, S.wallet[S.mode]) };
  }

  /* ---------- render ---------- */
  var WALLET_COLOR = { 'Cash sum': '--w-cash-sum', 'Card sum': '--w-card-sum', 'Cash dollar': '--w-cash-usd', 'Visa': '--w-visa', 'Master card': '--w-master' };
  function wcolor(w) { return 'var(' + (WALLET_COLOR[w] || '--muted') + ')'; }
  function wdot(w) { return '<span class="wdot" style="--wc:' + wcolor(w) + '" aria-hidden="true"></span>'; }
  function walletBtn(w, role, pressed, disabled) {
    var bal = D.balances[w] || 0;
    return '<button class="wallet" style="--wc:' + wcolor(w) + '" data-w="' + esc(w) + '" data-role="' + role + '" aria-pressed="' + pressed + '"' + (disabled ? ' disabled' : '') + '>' +
      '<span class="w-name">' + esc(w) + '</span><span class="w-bal' + (bal < 0 ? ' neg' : '') + '">' + esc(money(bal, w)) + '</span></button>';
  }
  function renderWallets() {
    if (S.mode === 'ex') {
      el.wallet.innerHTML =
        '<div class="ex-rows"><div><div class="ex-row-head"><span class="lbl">Qayerdan</span>' +
        '<button class="swap" data-act="swap">' + ICON.swap + 'Almashtirish</button></div>' +
        '<div class="hscroll">' + D.wallets.map(function (w) { return walletBtn(w, 'from', w === S.from, false); }).join('') + '</div></div>' +
        '<div><div class="ex-row-head"><span class="lbl">Qayerga</span></div>' +
        '<div class="hscroll">' + D.wallets.map(function (w) { return walletBtn(w, 'to', w === S.to, w === S.from); }).join('') + '</div></div></div>';
      return;
    }
    var cur = S.wallet[S.mode];
    el.wallet.innerHTML = '<div class="lbl-row"><span class="lbl">Hamyon</span></div><div class="hscroll">' +
      D.wallets.map(function (w) { return walletBtn(w, 'wallet', w === cur, false); }).join('') + '</div>';
  }

  function renderAmount() {
    var amt = total(S.amount);
    var caret = '<span class="caret" aria-hidden="true"></span>';
    if (S.mode === 'ex') {
      var cross = isUsd(S.from) !== isUsd(S.to);
      var rate = parseFloat(S.rate);
      var got = convert(amt, S.from, S.to, rate);
      var fUsd = isUsd(S.from);
      var amountVal = (fUsd ? '<span class="amt-cur">$</span>' : '') + '<span>' + showExpr(S.amount) + '</span>' + (fUsd ? '' : '<span class="amt-cur">soʻm</span>');
      var html = '<div class="ex-fields' + (cross ? '' : ' single') + '">' +
        '<button class="field" data-field="amount" aria-pressed="' + (S.focus === 'amount') + '"><span class="f-lbl">Beriladi · ' + esc(S.from || '') + '</span>' +
        '<span class="f-val' + (S.amount ? '' : ' empty') + '">' + amountVal + (S.focus === 'amount' ? caret : '') + '</span></button>';
      if (cross) {
        html += '<button class="field" data-field="rate" aria-pressed="' + (S.focus === 'rate') + '"><span class="f-lbl">Kurs, soʻm / $</span>' +
          '<span class="f-val' + (S.rate ? '' : ' empty') + '"><span>' + (S.rate ? showExpr(S.rate) : '0') + '</span>' + (S.focus === 'rate' ? caret : '') + '</span></button>';
      }
      html += '</div><div class="ex-out"><span>' + esc(S.to || '') + ' hamyoniga tushadi</span><b>' +
        (amt > 0 && isFinite(got) ? esc(money(got, S.to)) : '—') + '</b></div>';
      el.amount.innerHTML = html;
      return;
    }
    var w = S.wallet[S.mode];
    var usd = isUsd(w);
    var long = showExpr(S.amount).length > 11;
    var hint = [];
    if (S.amount.indexOf('+') >= 0 && amt > 0) hint.push('<span>= <b>' + esc(money(amt, w)) + '</b></span>');
    if (amt > 0 && D.lastRate) hint.push('<span>≈ ' + (usd ? esc(fmtNum(amt * D.lastRate, 0)) + ' soʻm' : '$' + esc(fmtNum(amt / D.lastRate, 2))) + '</span>');
    if (amt > 0 && w) {
      var after = (D.balances[w] || 0) + (S.mode === 'in' ? amt : -amt);
      hint.push('<span>Qoldiq: ' + esc(money(after, w)) + '</span>');
    }
    if (S.mode === 'in' && w && !usd && D.lastRate) hint.push('<span>kurs ' + esc(fmtNum(D.lastRate, 2)) + ' bilan</span>');
    el.amount.innerHTML = '<div class="amount"><div class="lbl-row"><span class="lbl">' + (S.mode === 'in' ? 'Kirim summasi' : 'Chiqim summasi') + '</span></div>' +
      '<div class="amt' + (long ? ' long' : '') + (S.amount ? '' : ' empty') + '">' +
      (usd ? '<span class="amt-cur">$</span>' : '') + '<span class="amt-val">' + showExpr(S.amount) + '</span>' + caret +
      (usd ? '' : '<span class="amt-cur">soʻm</span>') + '</div>' +
      '<div class="amt-hint">' + hint.join('') + '</div></div>';
  }

  function catNames(mode) {
    var names = mode === 'out'
      ? D.outCats.map(function (c) { return c.name; }).filter(function (n) { return n !== EXCHANGE; })
      : D.inCats.slice();
    var u = D.usage[mode] || {};
    return names.sort(function (a, b) { return (u[b] || 0) - (u[a] || 0) || a.localeCompare(b); });
  }
  function renderCats() {
    if (S.mode === 'ex') { el.cat.hidden = true; return; }
    el.cat.hidden = false;
    var all = catNames(S.mode);
    var sel = S.cat[S.mode];
    var top = all.slice(0, 30);
    if (sel && top.indexOf(sel) < 0) top = [sel].concat(top);
    el.cat.innerHTML = '<div class="lbl-row"><span class="lbl">Kategoriya</span>' +
      '<button class="link" data-act="open-sheet">Barchasi (' + all.length + ')</button></div><div class="chips">' +
      top.map(function (n) { return '<button class="chip" data-cat="' + esc(n) + '" aria-pressed="' + (n === sel) + '">' + esc(n.trim()) + '</button>'; }).join('') +
      '</div>';
    fitCatChips();
  }

  // Eng koʻp ishlatiladiganlar 3 qatorni chetigacha toʻldiradi: telefonda kamroq, keng ekranda koʻproq.
  // Sigʻmagan uzun nom oʻrniga keyingi qisqasi joylashadi (tartib baribir ishlatilish soni boʻyicha).
  var CAT_ROWS = 3;
  function fitCatChips() {
    var box = el.cat.querySelector('.chips');
    if (!box || el.cat.hidden) return;
    var chips = Array.prototype.slice.call(box.children);
    var fit = function () {
      chips.forEach(function (c) { c.hidden = false; });
      var tops = [];
      chips.forEach(function (c) { if (tops.indexOf(c.offsetTop) < 0) tops.push(c.offsetTop); });
      tops.sort(function (a, b) { return a - b; });
      var limit = tops[Math.min(CAT_ROWS, tops.length) - 1];
      chips.forEach(function (c) { if (c.offsetTop > limit) c.hidden = true; });
    };
    fit();
    var selChip = box.querySelector('[aria-pressed="true"]');
    if (selChip && selChip.hidden) { box.insertBefore(selChip, box.firstChild); chips = Array.prototype.slice.call(box.children); fit(); }
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (S.ready) fitCatChips(); }, 120); });

  function renderDates() {
    var today = iso(new Date()), yday = shiftIso(today, -1);
    var other = S.date !== today && S.date !== yday;
    el.dates.innerHTML =
      '<button class="chip sm" data-date="' + today + '" aria-pressed="' + (S.date === today) + '">Bugun</button>' +
      '<button class="chip sm" data-date="' + yday + '" aria-pressed="' + (S.date === yday) + '">Kecha</button>' +
      '<label class="chip sm" aria-pressed="' + other + '">' + ICON.cal + '<span>' + (other ? esc(ddmm(S.date)) : 'Boshqa sana') + '</span>' +
      '<input type="date" id="dateInput" value="' + esc(S.date) + '" aria-label="Sanani tanlash"></label>';
  }

  function recKind(r) { return r.sheet === 'in' ? 'in' : (r.cat === EXCHANGE ? 'ex' : 'out'); }
  function renderRecent() {
    var items = D.recent.slice(0, 10);
    var html = '<div class="lbl-row"><span class="lbl">Oxirgi yozuvlar</span></div>';
    if (!items.length) { el.recent.innerHTML = html + '<p class="empty-note">Hali yozuv yoʻq.</p>'; return; }
    html += '<ul class="recent">' + items.map(function (r) {
      var k = recKind(r);
      var title = k === 'ex' ? r.wallet + ' → ' + r.to : String(r.cat).trim();
      var sub = (k === 'ex'
        ? [r.rate ? esc('kurs ' + fmtNum(r.rate, 2)) : '', esc(ddmm(r.date))]
        : [r.wallet ? wdot(r.wallet) + esc(r.wallet) : '', esc(ddmm(r.date)), esc(r.note)]).filter(Boolean).join(' · ');
      var amt = (k === 'in' ? '+' : k === 'out' ? '−' : '') + money(r.amount, r.wallet);
      var mark = k === 'ex' ? ICON.ex : (k === 'in' ? '+' : '−');
      var mine = S.lastSaved === r;
      return '<li class="rec' + (mine ? ' fresh' : '') + '" data-kind="' + k + '"><span class="dot" aria-hidden="true">' + mark + '</span>' +
        '<div class="rec-main"><div class="rec-title">' + esc(title) + '</div><div class="rec-sub">' + sub + '</div>' +
        (mine ? '<button class="undo" data-act="undo">Bekor qilish</button>' : '') + '</div>' +
        '<div class="rec-amt">' + esc(amt) + '</div></li>';
    }).join('') + '</ul>';
    el.recent.innerHTML = html;
  }

  function renderKeypad() {
    var rateField = S.mode === 'ex' && S.focus === 'rate';

      parts.forEach(function (p) { if (!segs.length || hasNumber(p)) segs.push(p); else segs[segs.length - 1] += ' ' + p; });
      if (segs.length > 1 && !hasNumber(segs[0])) { segs[1] = segs[0] + ' ' + segs[1]; segs.shift(); }
      return segs.map(function (s) { return parseSeg(s, ctx); }).filter(function (e) { return e.amount > 0; });
    }
    return { parse: parse };
  })();
  /* PARSER END */

  function cmdCtx() {
    return { outCats: D.outCats.map(function (c) { return c.name; }), inCats: D.inCats, usage: D.usage, today: iso(new Date()), isUsd: isUsd };
  }

  /* ---------- voice ---------- */
  function normVoice(e) {
    var t = e.type === 'exchange' ? 'exchange' : (e.type === 'in' ? 'in' : 'out');
    var x = { type: t, category: t === 'exchange' ? EXCHANGE : (e.category || null), amount: Number(e.amount) || 0,
      wallet: e.wallet || null, to: e.to || null, rate: Number(e.rate) > 0 ? Number(e.rate) : null,
      date: /^\d{4}-\d{2}-\d{2}$/.test(e.date || '') ? e.date : iso(new Date()), note: e.note || '' };
    if (t === 'exchange') {
      if (!x.wallet) x.wallet = D.exPair ? D.exPair[0] : null;
      if (!x.to) x.to = D.exPair && D.exPair[1] !== x.wallet ? D.exPair[1] : null;
      if (x.to === x.wallet) x.to = null;
      var cross = x.wallet && x.to && isUsd(x.wallet) !== isUsd(x.to);
      if (!cross) x.rate = null;
      else if (!x.rate) x.rate = parseFloat(rateFor(x.wallet, x.to)) || null;
    } else if (!x.wallet) {
      x.wallet = (x.category && D.favWallet[t] && D.favWallet[t][x.category]) || (D.defaultWallet && D.defaultWallet[t]) || null;
    }
    return x;
  }
  function voiceMissing(x) {
    if (!(x.amount > 0)) return 'Summa yoʻq';
    if (x.type === 'exchange') {
      if (!x.wallet || !x.to) return 'Hamyonni tanlang';
      if (isUsd(x.wallet) !== isUsd(x.to) && !(x.rate > 0)) return 'Kursni kiriting';
      return '';
    }
    if (!x.category) return 'Kategoriyani tanlang';
    if (!x.wallet) return 'Hamyonni tanlang';
    return '';
  }
  function voicePayload(x) {
    return { type: x.type, date: x.date, category: x.category, amount: round2(x.amount), expr: '', wallet: x.wallet,
      to: x.type === 'exchange' ? x.to : '', rate: x.type === 'exchange' ? x.rate : null, note: x.note };
  }

  function renderVoice() {

  function voiceRows(withDelete) {

  var EXAMPLES = ['medicine 150k cash sum', 'grocery two hundred thousand card sum', 'doctor 50 dollars cash dollar',
    'medicine 150k cash sum, taxi 30k card sum', "100$ almashtirdim naqd so'mga 12100", 'kirim dividend 1000$'];
  // Matn yozilayotganda (yoki klaviatura mikrofoni bilan aytilayotganda) natija shu zahoti chiqadi

  // Ovoz bilan yozish qurilmaning oʻz diktovkasi orqali: qaysi tugma bosilishini qurilmaga qarab aytamiz
  function dictationTip() {
    var ua = navigator.userAgent || '', pf = navigator.platform || '';
    var touch = 'ontouchend' in document;
    if (/Mac/.test(pf) && !touch) return 'Ovoz bilan: maydonni bosing, <b>fn</b> tugmasini ikki marta (yoki yuqoridagi mikrofonli F5 ni) bosing va gapiring.';
    if (/Win/.test(pf)) return 'Ovoz bilan: maydonni bosing, <b>Win + H</b> ni bosing va gapiring.';
    if (/iPhone|iPad|Android/.test(ua) || touch) return 'Ovoz bilan: klaviaturadagi <b>mikrofon</b> tugmasini bosib gapiring.';
    return 'Ovoz bilan: kompyuteringizning diktovka funksiyasini yoqib gapiring.';

  function updateCmd(text) {

    V.entries = CMD.parse(text, cmdCtx()).map(normVoice);
    V.transcript = text; V.source = 'text';
    renderCmdOut();
  }

  function renderPending() {
    var n = V.entries.length;

  function openVoiceSheet() {
    V.open = true; el.voiceSheet.hidden = false; el.sheetBg.hidden = false;
    if (IN_TG) { try { tg.BackButton.show(); } catch (e) {} }
    renderVoice(); renderPending(); renderSave();
  }
  function closeVoiceSheet() {
    if (V.state === 'rec') stopRecording(false);
    if (V.state === 'busy') return;
    V.open = false; el.voiceSheet.hidden = true; el.sheetBg.hidden = true;
    if (V.state !== 'review' || !V.entries.length) { V.state = 'idle'; V.entries = []; V.transcript = ''; V.text = ''; }
    if (IN_TG && !S.sheetOpen) { try { tg.BackButton.hide(); } catch (e) {} }
    renderPending(); renderSave();
  }

  function voiceFail(msg) { V.state = 'error'; V.error = msg; haptic('error'); renderVoice(); }

  function startVoice() {
    if (!S.ready || S.busy) return;
    V.entries = []; V.transcript = ''; V.cancelled = false;
    if (!LIVE) return showInput();
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia || !window.MediaRecorder) { V.state = 'error'; openVoiceSheet(); return voiceFail('Bu qurilmada Telegram ichida ovoz yozib boʻlmaydi. Telegramni yangilab koʻring.'); }
    var AC = window.AudioContext || window.webkitAudioContext;
    try { V.ac = AC ? new AC() : null; } catch (e) { V.ac = null; }
    V.state = 'rec'; openVoiceSheet();
    md.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } }).then(function (stream) {
      if (V.state !== 'rec') { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      V.stream = stream; V.chunks = [];
      V.rec = new MediaRecorder(stream);
      V.rec.ondataavailable = function (e) { if (e.data && e.data.size) V.chunks.push(e.data); };
      V.rec.onstop = onRecorded;
      V.rec.start(250);
      V.t0 = Date.now(); tickTimer();
      if (V.ac) {
        try {
          if (V.ac.resume) V.ac.resume();
          V.analyser = V.ac.createAnalyser(); V.analyser.fftSize = 512;
          V.ac.createMediaStreamSource(stream).connect(V.analyser);
          meter();
        } catch (e) {}
      }
      haptic('light');
    }).catch(function (e) {
      var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      voiceFail(denied ? 'Mikrofonga ruxsat berilmadi. Telefon sozlamalarida Telegram uchun mikrofonni yoqing.' : 'Mikrofon ochilmadi: ' + (e && e.message || e));
      cleanupAudio();
    });
  }

  function tickTimer() {
    clearInterval(V.timer);
    V.timer = setInterval(function () {
      var s = Math.floor((Date.now() - V.t0) / 1000);
      var t = document.getElementById('vTimer');
      if (t) t.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
      if (s >= VOICE_MAX_SEC) stopRecording(true);
    }, 200);
  }
  function meter() {
    var buf = new Uint8Array(V.analyser.fftSize);
    (function loop() {
      if (V.state !== 'rec' || !V.analyser) return;
      V.analyser.getByteTimeDomainData(buf);
      var sum = 0;
      for (var i = 0; i < buf.length; i++) { var d = (buf[i] - 128) / 128; sum += d * d; }
      var o = document.getElementById('orb');
      if (o) o.style.setProperty('--lvl', (1 + Math.min(0.35, Math.sqrt(sum / buf.length) * 2.2)).toFixed(3));
      V.raf = requestAnimationFrame(loop);
    })();
  }
  function cleanupAudio() {
    clearInterval(V.timer); cancelAnimationFrame(V.raf);
    if (V.stream) V.stream.getTracks().forEach(function (t) { t.stop(); });
    if (V.ac && V.ac.close) { try { V.ac.close(); } catch (e) {} }
    V.stream = null; V.ac = null; V.analyser = null;
  }

  function stopRecording(send) {
    if (V.state !== 'rec') return;
    V.cancelled = !send;
    clearInterval(V.timer);
    V.state = send ? 'busy' : 'idle';
    if (send) { renderVoice(); haptic('light'); }
    if (V.rec && V.rec.state !== 'inactive') V.rec.stop(); else { cleanupAudio(); if (send) voiceFail('Ovoz yozilmadi. Qayta urinib koʻring.'); }
  }

  function onRecorded() {
    var type = (V.rec && V.rec.mimeType) || (V.chunks[0] && V.chunks[0].type) || 'audio/webm';
    var blob = new Blob(V.chunks, { type: type });
    cleanupAudio();
    if (V.cancelled) return;
    if (blob.size < 1500) return voiceFail('Ovoz juda qisqa. Tugmani bosib, gapirib boʻlgach “Tayyor” ni bosing.');
    toWav16k(blob).then(function (wav) { return { blob: wav, mime: 'audio/wav' }; }, function () { return { blob: blob, mime: type.split(';')[0] }; })
      .then(function (a) { return blobToBase64(a.blob).then(function (b64) { return api('voice', { audio: b64, mime: a.mime }); }); })
      .then(function (r) { showVoiceResult(r, 'voice'); })
      .catch(function (e) { voiceFail(e.message || String(e)); });
  }

  function showVoiceResult(r, source) {
    V.source = source || 'voice';
    V.transcript = r.transcript || '';
    var raw = r.entries || [];
    if (V.source === 'voice' && V.transcript) {
      // Gemini boʻsh qoldirgan joyni telefon ichidagi tahlil bilan toʻldiramiz ("medicine 150k cash sum" kabi qisqa gaplar)
      var local = CMD.parse(V.transcript, cmdCtx());
      if (!raw.length) raw = local;
      else if (local.length === raw.length) raw.forEach(function (x, i) {
        var l = local[i];
        if ((x.type || 'out') !== l.type) return;
        if (!x.category && l.category) x.category = l.category;
        if (!x.wallet && l.wallet) x.wallet = l.wallet;
        if (!(Number(x.amount) > 0) && l.amount > 0) x.amount = l.amount;
      });
    }
    V.entries = raw.map(normVoice);
    V.state = 'review';
    haptic(V.entries.length ? 'success' : 'warning');
    if (!V.open) openVoiceSheet(); else renderVoice();
    renderPending();
  }

  function showInput() {
    if (V.state === 'rec') stopRecording(false);
    V.state = 'input';
    V.entries = V.text ? CMD.parse(V.text, cmdCtx()).map(normVoice) : [];
    if (!V.open) openVoiceSheet(); else renderVoice();
    renderPending();
    var ta = document.getElementById('cmdText');
    if (ta) { ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {} }
  }
  // Har qanday yozuvni 16 kHz mono WAV ga aylantiradi: hajmi kichik va AI xizmati aniq qabul qiladi.
  function toWav16k(blob) {
    var AC = window.AudioContext || window.webkitAudioContext;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !OAC) return Promise.reject(new Error('no audio api'));
    return blob.arrayBuffer().then(function (buf) {
      var ac = new AC();
      return new Promise(function (res, rej) { ac.decodeAudioData(buf, res, rej); })
        .then(function (decoded) { try { ac.close(); } catch (e) {} return decoded; });
    }).then(function (decoded) {
      var rate = 16000, len = Math.max(1, Math.ceil(decoded.duration * rate));
      var off = new OAC(1, len, rate);
      var src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start(0);
      return new Promise(function (res) {
        off.oncomplete = function (e) { res(e.renderedBuffer); };
        var p = off.startRendering(); if (p && p.then) p.then(res);
      });
    }).then(function (rendered) {
      var pcm = rendered.getChannelData(0), n = pcm.length;
      var view = new DataView(new ArrayBuffer(44 + n * 2));
      var w = function (o, s) { for (var i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, 16000, true); view.setUint32(28, 32000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      w(36, 'data'); view.setUint32(40, n * 2, true);
      for (var i = 0; i < n; i++) { var s = Math.max(-1, Math.min(1, pcm[i])); view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
      return new Blob([view], { type: 'audio/wav' });
    });
  }

    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { rej(new Error('Ovozni oʻqib boʻlmadi')); };
      fr.readAsDataURL(blob);
    });
  }

  function saveVoiceAll() {
    if (S.busy) return;
    var queue = V.entries.filter(function (x) { return !voiceMissing(x); });
    if (!queue.length) return;
    S.busy = true; if (V.state === 'input') renderCmdOut(); else renderVoice(); renderSave();
    var saved = 0;
    var next = function () {
      var x = queue.shift();
      if (!x) return Promise.resolve();
      return persist(voicePayload(x)).then(function () {
        saved++;
        V.entries = V.entries.filter(function (y) { return y !== x; });
        if (V.state === 'input') renderCmdOut(); else renderVoice();
        return next();
      });
    };
    next().then(function () {
      S.busy = false;
      toast(saved + ' ta yozuv saqlandi' + (V.entries.length ? ', ' + V.entries.length + ' tasini toʻldiring' : ''), 'ok', saved === 1);
      haptic('success');

  }

    }).join('') : '<li class="empty-note" style="padding:14px 2px">Topilmadi. Yangi kategoriyani sheetdagi “List of items” varagʻiga qoʻshing.</li>';
  }
  function openSheet() {
    S.sheetOpen = true; el.search.value = ''; renderSheetList();
    el.sheet.hidden = false; el.sheetBg.hidden = false;
    if (IN_TG) { try { tg.BackButton.show(); } catch (e) {} }
    renderSave();
  }
  function closeSheet() {
    S.sheetOpen = false; el.sheet.hidden = true; el.sheetBg.hidden = true;
    if (IN_TG) { try { tg.BackButton.hide(); } catch (e) {} }
    renderSave();
  }

  /* ---------- events ---------- */
  document.getElementById('app').addEventListener('click', function (e) {
    var t = e.target.closest('[data-k],[data-set-mode],[data-w],[data-cat],[data-date],[data-field],[data-act],[data-vdel],[data-vedit],[data-example]');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-k')) return press(t.getAttribute('data-k'));
    if (t.hasAttribute('data-set-mode')) return setMode(t.getAttribute('data-set-mode'));
    if (t.hasAttribute('data-w')) return pickWallet(t.getAttribute('data-w'), t.getAttribute('data-role'));
    if (t.hasAttribute('data-cat')) { var n = t.getAttribute('data-cat'); if (S.sheetOpen) closeSheet(); return pickCat(n); }
    if (t.hasAttribute('data-date')) { S.date = t.getAttribute('data-date'); haptic('select'); return renderDates(); }
    if (t.hasAttribute('data-field')) { S.focus = t.getAttribute('data-field'); haptic('select'); renderAmount(); return renderKeypad(); }
    var act = t.getAttribute('data-act');
    if (act === 'open-sheet') return openSheet();
    if (act === 'close-sheet') return closeSheet();
    if (act === 'undo') { el.toast.hidden = true; return undo(); }
    if (act === 'swap') { var f = S.from; S.from = S.to; S.to = f; S.rate = rateFor(S.from, S.to); haptic('select'); return render(); }
    if (act === 'retry') return boot();
    if (act === 'voice') { if (V.state === 'rec') return; return startVoice(); }
    if (act === 'voice-input') return showInput();
    if (act === 'cmd-clear') { updateCmd(''); var c = document.getElementById('cmdText'); if (c) { c.value = ''; c.focus(); } return; }
    if (t.hasAttribute('data-example')) {
      var ex = t.getAttribute('data-example'), ta = document.getElementById('cmdText');
      if (ta) ta.value = ex;
      haptic('select');
      return updateCmd(ex);
    }
    if (act === 'voice-stop') return stopRecording(true);
    if (act === 'voice-cancel' || act === 'voice-close') return closeVoiceSheet();
    if (act === 'voice-save') return saveVoiceAll();
    if (act === 'voice-review') return openVoiceSheet();
    if (t.hasAttribute('data-vdel')) { if (!S.busy) { V.entries.splice(+t.getAttribute('data-vdel'), 1); haptic('select'); renderVoice(); } return; }
    if (t.hasAttribute('data-vedit')) return editVoiceEntry(+t.getAttribute('data-vedit'));
  });
  function closeTop() { if (V.open) closeVoiceSheet(); else if (S.sheetOpen) closeSheet(); }
  el.sheetBg.addEventListener('click', closeTop);
  el.voiceBody.addEventListener('input', function (e) { if (e.target.id === 'cmdText') updateCmd(e.target.value); });
  el.voiceBody.addEventListener('keydown', function (e) {
    if (e.target.id === 'cmdText' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
  });

  // iPhone: klaviatura ochilganda pastdagi oynani klaviatura ustiga koʻtaramiz
  function fitSheetsToKeyboard() {
    var vv = window.visualViewport;
    if (!vv) return;
    var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    [el.sheet, el.voiceSheet].forEach(function (sh) {
      sh.style.bottom = kb > 80 ? kb + 'px' : '';
      sh.style.maxHeight = kb > 80 ? Math.round(vv.height - 8) + 'px' : '';
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheetsToKeyboard);
    window.visualViewport.addEventListener('scroll', fitSheetsToKeyboard);
  }
  el.save.addEventListener('click', save);
  el.search.addEventListener('input', renderSheetList);
  el.dates.addEventListener('change', function (e) {
    if (e.target.id === 'dateInput' && e.target.value) { S.date = e.target.value; renderDates(); }
  });
  el.note.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.note.blur(); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || S.sheetOpen || V.open) { if (e.key === 'Escape') closeTop(); return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === '+') press('+');
    else if (e.key === '.' || e.key === ',') press('.');
    else if (e.key === 'Enter') save();
    else return;
    e.preventDefault();
  });

  /* ---------- telegram + boot ---------- */
  function syncTgHeader() {
    if (!tg) return;
    try { tg.setHeaderColor(cssVar('--wash')); } catch (e) {}
  }
  function setupTelegram() {
    if (!tg) return;
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    var theme = function () {
      if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme);
      syncTgHeader();
      try { tg.setBackgroundColor(cssVar('--bg')); } catch (e) {}
      try { if (tg.setBottomBarColor) tg.setBottomBarColor(cssVar('--surface')); } catch (e) {}
      if (S.ready) renderSave();
    };
    theme();
    try { tg.onEvent('themeChanged', theme); } catch (e) {}
    if (IN_TG) {
      try { tg.MainButton.onClick(save); } catch (e) {}
      try { tg.BackButton.onClick(closeTop); } catch (e) {}
    }
  }

  function showState(kind, msg) {
    el.form.hidden = kind !== 'ready';
    el.state.hidden = kind === 'ready';
    if (kind === 'loading') el.state.innerHTML = '<strong>Sheet yuklanmoqda…</strong><span>Hamyonlar va kategoriyalar olinmoqda</span>';
    if (kind === 'error') el.state.innerHTML = '<strong>Sheetga ulanib boʻlmadi</strong><span>' + esc(msg) + '</span><button data-act="retry">Qayta urinish</button>';
  }

  function setDefaults() {
    S.date = iso(new Date());
    S.wallet.out = (D.defaultWallet && D.defaultWallet.out) || D.wallets[0];
    S.wallet.in = (D.defaultWallet && D.defaultWallet.in) || D.wallets[0];
    var pair = D.exPair && D.exPair.length === 2 ? D.exPair : [D.wallets[1] || D.wallets[0], D.wallets[0]];
    S.from = pair[0]; S.to = pair[1];
    S.rate = rateFor(S.from, S.to);
    D.pairRate = D.pairRate || {};
  }

  function boot() {
    S.ready = false;
    if (!LIVE) {
      D = demoData();
      el.demo.hidden = false;
      setDefaults(); S.ready = true; showState('ready'); render();
      return;
    }
    showState('loading'); render();
    api('init').then(function (r) {
      D = r; setDefaults(); S.ready = true; showState('ready'); render();
    }).catch(function (e) {
      showState('error', e.message); render();
    });
  }

  setupTelegram();
  boot();
})();
</script>
</body>
</html>
